<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Current approval states and lost-reply boundary</title>
<desc id="diagram-description">A pending exact intent may become approved, consumed into a reservation and armed for dispatch. Backend outcome requires separate evidence. A lost arm reply or repeated arm returns ambiguity rather than another grant.</desc>
<style>
text {font-family:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;fill:var(--ink,#e7ebf1)}
.diagram-node {fill:var(--sheet,#171d26);stroke:var(--rule,#7b899a);stroke-width:2}
.current {fill:var(--strong-bg,#1b2b40);stroke:var(--strong,#8ab8ef)}
.proposed {fill:var(--change-bg,#3a2c14);stroke:var(--change,#f0b45a);stroke-dasharray:7 5}
.authority {fill:var(--patch-bg,#2c2240);stroke:var(--patch,#c3a6f0)}
.edge {fill:none;stroke:var(--accent,#6fc0ca);stroke-width:2.4;marker-end:url(#arrow)}
.edge-label {font-size:16px;fill:var(--ink-soft,#a5afbd)}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--accent,#6fc0ca)"/></marker></defs>
<rect x="0" y="0" width="900" height="520" fill="var(--paper,#11161d)"/>
<g><rect class="diagram-node authority" x="30" y="35" width="240" height="74" rx="5"/><text x="150.0" y="66" text-anchor="middle" font-size="23" font-weight="600">Pending challenge</text><text x="150.0" y="90" text-anchor="middle" font-size="16">exact intent + expiry</text></g>
<g><rect class="diagram-node authority" x="330" y="35" width="240" height="74" rx="5"/><text x="450.0" y="66" text-anchor="middle" font-size="23" font-weight="600">Approved decision</text><text x="450.0" y="90" text-anchor="middle" font-size="16">authorized consent recorded</text></g>
<g><rect class="diagram-node authority" x="630" y="35" width="240" height="74" rx="5"/><text x="750.0" y="66" text-anchor="middle" font-size="23" font-weight="600">Consumed reservation</text><text x="750.0" y="90" text-anchor="middle" font-size="16">single-use permission</text></g>
<g><rect class="diagram-node authority" x="630" y="230" width="240" height="74" rx="5"/><text x="750.0" y="261" text-anchor="middle" font-size="23" font-weight="600">Armed dispatch</text><text x="750.0" y="285" text-anchor="middle" font-size="16">grant persisted</text></g>
<g><rect class="diagram-node current" x="330" y="230" width="240" height="74" rx="5"/><text x="450.0" y="261" text-anchor="middle" font-size="23" font-weight="600">Backend outcome</text><text x="450.0" y="285" text-anchor="middle" font-size="16">requires execution evidence</text></g>
<g><rect class="diagram-node authority" x="30" y="230" width="240" height="74" rx="5"/><text x="150.0" y="261" text-anchor="middle" font-size="23" font-weight="600">Ambiguous reply</text><text x="150.0" y="285" text-anchor="middle" font-size="16">no second grant</text></g>
<path class="edge" d="M270 72 H330"/><text class="edge-label" x="300" y="54" text-anchor="middle">decide</text>
<path class="edge" d="M570 72 H630"/><text class="edge-label" x="600" y="54" text-anchor="middle">reserve</text>
<path class="edge" d="M750 109 V230"/><text class="edge-label" x="789" y="177" text-anchor="middle">arm</text>
<path class="edge" d="M630 267 H570"/><text class="edge-label" x="600" y="248" text-anchor="middle">execute</text>
<path class="edge" d="M750 304 V373 H150 V304"/><text class="edge-label" x="450" y="404" text-anchor="middle">lost arm reply / repeated arm</text>
<text x="450" y="475" font-size="18" text-anchor="middle">An armed record alone does not establish that the effect happened.</text>
</svg>
