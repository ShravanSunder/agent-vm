<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Interaction, operation and connection lifetimes</title>
<desc id="diagram-description">The proposed application interaction and operation span two different physical connections. Connection A is replaced by newly authenticated connection B. No execution retry is implied. Current transport and invocation limits are described in the prose.</desc>
<style>
text {font-family:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;fill:var(--ink,#e7ebf1)}
.diagram-node {fill:var(--sheet,#171d26);stroke:var(--rule,#7b899a);stroke-width:2}
.current {fill:var(--strong-bg,#1b2b40);stroke:var(--strong,#8ab8ef)}
.proposed {fill:var(--change-bg,#3a2c14);stroke:var(--change,#f0b45a);stroke-dasharray:7 5}
.authority {fill:var(--patch-bg,#2c2240);stroke:var(--patch,#c3a6f0)}
.edge {fill:none;stroke:var(--accent,#6fc0ca);stroke-width:2.4;marker-end:url(#arrow)}
.edge-label {font-size:16px;fill:var(--ink-soft,#a5afbd)}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--accent,#6fc0ca)"/></marker></defs>
<rect x="0" y="0" width="900" height="530" fill="var(--paper,#11161d)"/>
<text x="450" y="40" text-anchor="middle" font-size="22" font-weight="600">Requested application lifetime model</text><text x="25" y="152" font-size="19" font-weight="600">Logical interaction</text><text x="25" y="297" font-size="19" font-weight="600">Operation</text><text x="25" y="442" font-size="19" font-weight="600">Physical connection</text><g><rect class="diagram-node proposed" x="235" y="120" width="625" height="74" rx="5"/><text x="547.5" y="151" text-anchor="middle" font-size="23" font-weight="600">Same interaction</text><text x="547.5" y="175" text-anchor="middle" font-size="16">explicit application identity and lifetime</text></g>
<g><rect class="diagram-node proposed" x="235" y="265" width="625" height="74" rx="5"/><text x="547.5" y="296" text-anchor="middle" font-size="23" font-weight="600">Same operation</text><text x="547.5" y="320" text-anchor="middle" font-size="16">accepted → running → retained result</text></g>
<g><rect class="diagram-node current" x="235" y="410" width="250" height="74" rx="5"/><text x="360.0" y="441" text-anchor="middle" font-size="23" font-weight="600">Connection A</text><text x="360.0" y="465" text-anchor="middle" font-size="16">temporary attachment</text></g>
<g><rect class="diagram-node current" x="610" y="410" width="250" height="74" rx="5"/><text x="735.0" y="441" text-anchor="middle" font-size="23" font-weight="600">Connection B</text><text x="735.0" y="465" text-anchor="middle" font-size="16">new authenticated attachment</text></g>
<path class="edge" d="M485 447 H610"/><text class="edge-label" x="547" y="427" text-anchor="middle">gap</text>
<text x="550" y="218" text-anchor="middle" class="edge-label">Transport replacement does not create another execution.</text>
</svg>
