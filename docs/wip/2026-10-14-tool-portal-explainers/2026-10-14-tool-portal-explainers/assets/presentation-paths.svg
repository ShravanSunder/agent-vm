<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Three presentations over one capability contract</title>
<desc id="diagram-description">Individual tools, compact Portal discovery and programmatic bindings are different presentations. Each remains subject to the same authorized capability and approval contract.</desc>
<style>
text {font-family:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;fill:var(--ink,#e7ebf1)}
.diagram-node {fill:var(--sheet,#171d26);stroke:var(--rule,#7b899a);stroke-width:2}
.current {fill:var(--strong-bg,#1b2b40);stroke:var(--strong,#8ab8ef)}
.proposed {fill:var(--change-bg,#3a2c14);stroke:var(--change,#f0b45a);stroke-dasharray:7 5}
.authority {fill:var(--patch-bg,#2c2240);stroke:var(--patch,#c3a6f0)}
.edge {fill:none;stroke:var(--accent,#6fc0ca);stroke-width:2.4;marker-end:url(#arrow)}
.edge-label {font-size:16px;fill:var(--ink-soft,#a5afbd)}
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="var(--accent,#6fc0ca)"/></marker></defs>
<rect x="0" y="0" width="900" height="520" fill="var(--paper,#11161d)"/>
<g><rect class="diagram-node current" x="315" y="25" width="270" height="74" rx="5"/><text x="450.0" y="56" text-anchor="middle" font-size="23" font-weight="600">Authenticated caller</text><text x="450.0" y="80" text-anchor="middle" font-size="16">harness / SDK</text></g>
<g><rect class="diagram-node current" x="20" y="190" width="260" height="74" rx="5"/><text x="150.0" y="221" text-anchor="middle" font-size="23" font-weight="600">Individual catalog</text><text x="150.0" y="245" text-anchor="middle" font-size="16">client-owned discovery</text></g>
<g><rect class="diagram-node current" x="320" y="190" width="260" height="74" rx="5"/><text x="450.0" y="221" text-anchor="middle" font-size="23" font-weight="600">Compact Portal</text><text x="450.0" y="245" text-anchor="middle" font-size="16">list / search / describe / call</text></g>
<g><rect class="diagram-node current" x="620" y="190" width="260" height="74" rx="5"/><text x="750.0" y="221" text-anchor="middle" font-size="23" font-weight="600">Programmatic binding</text><text x="750.0" y="245" text-anchor="middle" font-size="16">code composes calls</text></g>
<g><rect class="diagram-node current" x="315" y="390" width="270" height="74" rx="5"/><text x="450.0" y="421" text-anchor="middle" font-size="23" font-weight="600">Capability service</text><text x="450.0" y="445" text-anchor="middle" font-size="16">same policy + exact approval</text></g>
<path class="edge" d="M450 99 V144 H150 V190"/>
<path class="edge" d="M450 99 V190"/>
<path class="edge" d="M450 99 V144 H750 V190"/>
<path class="edge" d="M150 264 V336 H450 V390"/>
<path class="edge" d="M450 264 V390"/>
<path class="edge" d="M750 264 V336 H450 V390"/>

</svg>
