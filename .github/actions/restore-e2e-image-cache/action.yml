name: Restore one Agent VM E2E image cache
description: Restore one prepared image family using the canonical input identity.
inputs:
  family:
    description: Prepared image family to restore.
    required: true
  input-hash:
    description: Canonical image input hash.
    required: true
  lookup-only:
    description: Check cache availability without downloading cache contents.
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact prepared family cache exists.
    value: ${{ steps.hermes.outputs.cache-hit || steps.worker.outputs.cache-hit }}
  primary-key:
    description: Exact family cache key for a later save.
    value: ${{ steps.hermes.outputs.cache-primary-key || steps.worker.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Restore prepared Hermes image cache
      id: hermes
      if: inputs.family == 'hermes'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          /tmp/agent-vm-e2e-cache/hermes
          /tmp/agent-vm-e2e-cache/local-package-tarballs
        key: agent-vm-e2e-images-v1-hermes-${{ runner.os }}-${{ inputs.input-hash }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore prepared Worker image cache
      id: worker
      if: inputs.family == 'worker'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: /tmp/agent-vm-e2e-cache/worker
        key: agent-vm-e2e-images-v1-worker-${{ runner.os }}-${{ inputs.input-hash }}
        lookup-only: ${{ inputs.lookup-only }}
