name: Resolve Agent VM E2E image cache key
description: Calculate the canonical identity shared by prepared image cache families.
outputs:
  input-hash:
    description: Canonical image input hash.
    value: ${{ steps.cache-key.outputs.hash }}
runs:
  using: composite
  steps:
    - name: Resolve E2E image cache key
      id: cache-key
      shell: bash
      env:
        E2E_IMAGE_INPUT_HASH: ${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'uv.lock', '.node-version', '.npmrc', '.pnpmfile.cjs', 'mise.toml', 'tsconfig*.json', '.github/actions/setup-agent-vm/action.yml', '.github/actions/setup-python-workspace/action.yml', '.github/actions/setup-system-packages/action.yml', '.github/actions/restore-e2e-image-cache/action.yml', '.github/actions/resolve-e2e-image-cache-key/action.yml', 'scripts/prepare-e2e-image-cache.ts', 'packages/**/package.json', 'packages/**/src/**', 'packages/**/type-tests/**', 'packages/**/tsconfig*.json', 'packages/**/tsdown.config.ts', 'packages/**/README*', 'packages/**/LICENSE*', 'packages/**/LICENCE*', 'packages/**/portable-contract-schema-manifest.json', 'packages/**/contract-fixtures/**', 'packages/**/sdk-validate.mjs', 'packages/agent-vm/managed-images.json', 'python/**', 'vm-images/**') }}
      run: test -n "${E2E_IMAGE_INPUT_HASH}" && echo "hash=${E2E_IMAGE_INPUT_HASH}" >> "${GITHUB_OUTPUT}"
