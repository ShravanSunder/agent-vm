name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Node workspace
            uses: ./.github/actions/setup-agent-vm
            with:
              build: 'false'

          - name: Set up Python workspace
            uses: ./.github/actions/setup-python-workspace

      - name: Quality checks
        run: pnpm check

      - parallel:
          - name: Unit tests
            run: pnpm test:unit

          - name: Integration tests
            run: pnpm test:integration

          - name: Host Python tests
            run: pnpm python:test:host

          - name: Hermes adapter tests in pinned runtime
            run: pnpm python:test:hermes

          - name: E2E inventory
            run: pnpm test:e2e:inventory

  e2e-image-cache:
    name: Prepare E2E image cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve prepared image cache identity
        id: image-key
        uses: ./.github/actions/resolve-e2e-image-cache-key

      - parallel:
          - name: Find prepared OpenClaw image cache
            id: openclaw-image
            uses: ./.github/actions/restore-e2e-image-cache
            with:
              family: openclaw
              input-hash: ${{ steps.image-key.outputs.input-hash }}
              lookup-only: 'true'

          - name: Find prepared Worker image cache
            id: worker-image
            uses: ./.github/actions/restore-e2e-image-cache
            with:
              family: worker
              input-hash: ${{ steps.image-key.outputs.input-hash }}
              lookup-only: 'true'

      - parallel:
          - name: Set up Node workspace for image preparation
            if: steps.openclaw-image.outputs.cache-hit != 'true' || steps.worker-image.outputs.cache-hit != 'true'
            uses: ./.github/actions/setup-agent-vm

          - name: Set up system packages for image preparation
            if: steps.openclaw-image.outputs.cache-hit != 'true' || steps.worker-image.outputs.cache-hit != 'true'
            uses: ./.github/actions/setup-system-packages

      - name: Prepare current E2E images
        if: steps.openclaw-image.outputs.cache-hit != 'true' || steps.worker-image.outputs.cache-hit != 'true'
        env:
          AGENT_VM_E2E_CACHE_DIR: /tmp/agent-vm-e2e-cache
        run: pnpm exec tsx scripts/prepare-e2e-image-cache.ts

      - parallel:
          - name: Save prepared OpenClaw image cache
            if: steps.openclaw-image.outputs.cache-hit != 'true'
            uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
              path: |
                /tmp/agent-vm-e2e-cache/openclaw
                /tmp/agent-vm-e2e-cache/local-package-tarballs
              key: ${{ steps.openclaw-image.outputs.primary-key }}

          - name: Save prepared Worker image cache
            if: steps.worker-image.outputs.cache-hit != 'true'
            uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
            with:
              path: /tmp/agent-vm-e2e-cache/worker
              key: ${{ steps.worker-image.outputs.primary-key }}

  e2e-host:
    name: E2E (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - host-docker
          - host
          - vm-mediation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - parallel:
          - name: Set up Node workspace
            uses: ./.github/actions/setup-agent-vm

          - name: Set up system packages
            uses: ./.github/actions/setup-system-packages

      - name: Run E2E lane
        env:
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
        run: pnpm run test:e2e:${{ matrix.lane }}

  e2e-vm:
    name: E2E (${{ matrix.lane }})
    needs: e2e-image-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: e2e-vm-shard-1
            managed-gateway-test-group: ''
            shard: 1/6
          - lane: e2e-vm-shard-2
            managed-gateway-test-group: ''
            shard: 2/6
          - lane: e2e-vm-shard-3
            managed-gateway-test-group: ''
            shard: 3/6
          - lane: e2e-vm-shard-4
            managed-gateway-test-group: ''
            shard: 4/6
          - lane: e2e-vm-shard-5
            managed-gateway-test-group: ''
            shard: 5/6
          - lane: e2e-vm-shard-6
            managed-gateway-test-group: ''
            shard: 6/6
          - lane: e2e-vm-managed-gateway-core
            managed-gateway-test-group: core
            shard: ''
          - lane: e2e-vm-managed-gateway-inputs
            managed-gateway-test-group: input-missing-tool-portal
            shard: ''
          - lane: e2e-vm-managed-gateway-inputs-framework
            managed-gateway-test-group: input-missing-framework
            shard: ''
          - lane: e2e-vm-managed-gateway-inputs-read-only
            managed-gateway-test-group: input-read-only-environment
            shard: ''
          - lane: e2e-vm-managed-gateway-termination-tool-portal
            managed-gateway-test-group: termination-tool-portal
            shard: ''
          - lane: e2e-vm-managed-gateway-termination-openclaw
            managed-gateway-test-group: termination-openclaw
            shard: ''
          - lane: e2e-vm-managed-gateway-worker
            managed-gateway-test-group: worker-stock
            shard: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve prepared image cache identity
        id: image-key
        uses: ./.github/actions/resolve-e2e-image-cache-key

      - parallel:
          - name: Restore prepared OpenClaw image cache
            id: openclaw-image
            uses: ./.github/actions/restore-e2e-image-cache
            with:
              family: openclaw
              input-hash: ${{ steps.image-key.outputs.input-hash }}

          - name: Restore prepared Worker image cache
            id: worker-image
            uses: ./.github/actions/restore-e2e-image-cache
            with:
              family: worker
              input-hash: ${{ steps.image-key.outputs.input-hash }}

          - name: Set up Agent VM workspace
            uses: ./.github/actions/setup-agent-vm

          - name: Set up system packages
            uses: ./.github/actions/setup-system-packages

      - name: Require prepared image caches
        env:
          OPENCLAW_CACHE_HIT: ${{ steps.openclaw-image.outputs.cache-hit }}
          WORKER_CACHE_HIT: ${{ steps.worker-image.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "${OPENCLAW_CACHE_HIT}" = true
          test "${WORKER_CACHE_HIT}" = true

      - name: Run VM shard
        if: matrix.shard != ''
        env:
          AGENT_VM_E2E_CACHE_DIR: /tmp/agent-vm-e2e-cache
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
        run: pnpm run test:e2e:vm -- --shard=${{ matrix.shard }}

      - name: Run managed Gateway group
        if: matrix.managed-gateway-test-group != ''
        env:
          AGENT_VM_E2E_CACHE_DIR: /tmp/agent-vm-e2e-cache
          AGENT_VM_E2E_REQUIRE_PREPARED_IMAGE_CACHE: '1'
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
          AGENT_VM_MANAGED_GATEWAY_TEST_GROUP: ${{ matrix.managed-gateway-test-group }}
        run: pnpm run test:e2e:vm-managed-gateway

  check:
    name: check
    if: always()
    needs:
      - validation
      - e2e-image-cache
      - e2e-host
      - e2e-vm
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          E2E_IMAGE_CACHE_RESULT: ${{ needs.e2e-image-cache.result }}
          E2E_HOST_RESULT: ${{ needs.e2e-host.result }}
          E2E_VM_RESULT: ${{ needs.e2e-vm.result }}
        run: |
          set -euo pipefail
          results=(
            "validation=${VALIDATION_RESULT}"
            "e2e-image-cache=${E2E_IMAGE_CACHE_RESULT}"
            "e2e-host=${E2E_HOST_RESULT}"
            "e2e-vm=${E2E_VM_RESULT}"
          )
          printf '%s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [[ "${result##*=}" != success ]]; then
              echo "CI lane did not pass: ${result}" >&2
              exit 1
            fi
          done
