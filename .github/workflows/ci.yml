name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age qemu-system-arm

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Typecheck skipped in CI — @earendil-works/gondolin is locally linked
      # and not available in CI. Run `pnpm check` locally to verify types.

      - name: Unit tests
        run: pnpm test

      - name: Gondolin rootfs smoke test
        run: pnpm vitest run --config vitest.smoke.config.ts packages/gondolin-adapter/src/build-pipeline.smoke.test.ts
