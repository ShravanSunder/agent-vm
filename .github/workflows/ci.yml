name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-agent-vm

      - name: Test taxonomy audit
        run: pnpm test:taxonomy

      - name: Portal architecture audit
        run: pnpm test:portal-architecture

      - name: Portal package export audit
        run: pnpm test:portal-exports

      - name: Generated portal contract freshness
        run: pnpm exec tsx scripts/generate-portal-contracts.ts --check-clean

      - name: Host Python tests
        run: pnpm python:test:host

      - name: Hermes adapter tests in pinned runtime
        run: pnpm python:test:hermes

      - name: Python format check
        run: pnpm python:fmt:check

      - name: Python lint
        run: pnpm python:lint

      - name: Host Python typecheck
        run: pnpm python:typecheck:host

      - name: Hermes adapter typecheck in pinned runtime
        run: pnpm python:typecheck:hermes

      - name: Lint
        run: pnpm lint

      - name: Type-aware lint
        run: pnpm lint:types

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-agent-vm

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

  e2e-inventory:
    name: E2E inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-agent-vm
        with:
          build: 'false'

      - name: E2E inventory
        run: pnpm test:e2e:inventory

  e2e-image-cache:
    name: Prepare E2E image cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve E2E image cache key
        id: e2e-image-cache-key
        shell: bash
        env:
          E2E_IMAGE_INPUT_HASH: ${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'uv.lock', 'tsconfig*.json', 'scripts/prepare-e2e-image-cache.ts', 'packages/**/package.json', 'packages/**/src/**', 'packages/**/tsconfig*.json', 'packages/**/tsdown.config.ts', 'packages/**/README*', 'packages/**/LICENSE*', 'packages/**/LICENCE*', 'packages/**/openclaw.plugin.json', 'packages/**/portable-contract-schema-manifest.json', 'packages/**/contract-fixtures/**', 'packages/**/sdk-validate.mjs', 'packages/agent-vm/managed-images.json', 'python/**', 'vm-images/**') }}
        run: test -n "${E2E_IMAGE_INPUT_HASH}" && echo "hash=${E2E_IMAGE_INPUT_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore prepared OpenClaw image cache
        id: e2e-openclaw-image-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agent-vm-e2e-cache/openclaw
          key: agent-vm-e2e-images-v1-openclaw-${{ runner.os }}-${{ steps.e2e-image-cache-key.outputs.hash }}
          lookup-only: true

      - name: Restore prepared Worker image cache
        id: e2e-worker-image-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agent-vm-e2e-cache/worker
          key: agent-vm-e2e-images-v1-worker-${{ runner.os }}-${{ steps.e2e-image-cache-key.outputs.hash }}
          lookup-only: true

      - uses: ./.github/actions/setup-agent-vm
        if: steps.e2e-openclaw-image-cache-restore.outputs.cache-hit != 'true' || steps.e2e-worker-image-cache-restore.outputs.cache-hit != 'true'

      - name: Prepare current E2E images
        if: steps.e2e-openclaw-image-cache-restore.outputs.cache-hit != 'true' || steps.e2e-worker-image-cache-restore.outputs.cache-hit != 'true'
        env:
          AGENT_VM_E2E_CACHE_DIR: /tmp/agent-vm-e2e-cache
        run: pnpm exec tsx scripts/prepare-e2e-image-cache.ts

      - name: Save prepared OpenClaw image cache
        if: steps.e2e-openclaw-image-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agent-vm-e2e-cache/openclaw
          key: ${{ steps.e2e-openclaw-image-cache-restore.outputs.cache-primary-key }}

      - name: Save prepared Worker image cache
        if: steps.e2e-worker-image-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agent-vm-e2e-cache/worker
          key: ${{ steps.e2e-worker-image-cache-restore.outputs.cache-primary-key }}

  e2e-fast:
    name: E2E (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: e2e-host-docker
            command: pnpm run test:e2e:host-docker
          - lane: e2e-host
            command: pnpm run test:e2e:host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-agent-vm

      - name: Run E2E lane
        env:
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
        run: ${{ matrix.command }}

  e2e-vm:
    name: E2E (${{ matrix.lane }})
    needs: e2e-image-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: e2e-vm-shard-1
            command: pnpm run test:e2e:vm -- --exclude packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts --shard=1/4
          - lane: e2e-vm-shard-2
            command: pnpm run test:e2e:vm -- --exclude packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts --shard=2/4
          - lane: e2e-vm-shard-3
            command: pnpm run test:e2e:vm -- --exclude packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts --shard=3/4
          - lane: e2e-vm-shard-4
            command: pnpm run test:e2e:vm -- --exclude packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts --shard=4/4
          - lane: e2e-vm-managed-gateway-core
            managed-gateway-test-group: core
            command: >-
              pnpm run test:e2e:vm --
              packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts
          - lane: e2e-vm-managed-gateway-inputs
            managed-gateway-test-group: inputs
            command: >-
              pnpm run test:e2e:vm --
              packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts
          - lane: e2e-vm-managed-gateway-termination
            managed-gateway-test-group: termination
            command: >-
              pnpm run test:e2e:vm --
              packages/agent-vm/src/integration-tests/managed-gateway-image-boot.vm.e2e.test.ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve E2E image cache key
        id: e2e-image-cache-key
        shell: bash
        env:
          E2E_IMAGE_INPUT_HASH: ${{ hashFiles('package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'uv.lock', 'tsconfig*.json', 'scripts/prepare-e2e-image-cache.ts', 'packages/**/package.json', 'packages/**/src/**', 'packages/**/tsconfig*.json', 'packages/**/tsdown.config.ts', 'packages/**/README*', 'packages/**/LICENSE*', 'packages/**/LICENCE*', 'packages/**/openclaw.plugin.json', 'packages/**/portable-contract-schema-manifest.json', 'packages/**/contract-fixtures/**', 'packages/**/sdk-validate.mjs', 'packages/agent-vm/managed-images.json', 'python/**', 'vm-images/**') }}
        run: test -n "${E2E_IMAGE_INPUT_HASH}" && echo "hash=${E2E_IMAGE_INPUT_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore prepared OpenClaw image cache
        id: e2e-openclaw-image-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agent-vm-e2e-cache/openclaw
          key: agent-vm-e2e-images-v1-openclaw-${{ runner.os }}-${{ steps.e2e-image-cache-key.outputs.hash }}

      - name: Restore prepared Worker image cache
        id: e2e-worker-image-cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/agent-vm-e2e-cache/worker
          key: agent-vm-e2e-images-v1-worker-${{ runner.os }}-${{ steps.e2e-image-cache-key.outputs.hash }}

      - name: Set up Agent VM workspace
        uses: ./.github/actions/setup-agent-vm

      - name: Require prepared image caches
        env:
          OPENCLAW_CACHE_HIT: ${{ steps.e2e-openclaw-image-cache-restore.outputs.cache-hit }}
          WORKER_CACHE_HIT: ${{ steps.e2e-worker-image-cache-restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "${OPENCLAW_CACHE_HIT}" = true
          test "${WORKER_CACHE_HIT}" = true

      - name: Run E2E lane
        env:
          AGENT_VM_E2E_CACHE_DIR: /tmp/agent-vm-e2e-cache
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
          AGENT_VM_MANAGED_GATEWAY_TEST_GROUP: ${{ matrix.managed-gateway-test-group }}
        run: ${{ matrix.command }}

  e2e-vm-mediation:
    name: E2E (e2e-vm-mediation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-agent-vm

      - name: Run E2E lane
        env:
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD: '1'
        run: pnpm run test:e2e:vm-mediation

  check:
    name: check
    if: always()
    needs:
      - quality
      - tests
      - e2e-inventory
      - e2e-image-cache
      - e2e-fast
      - e2e-vm
      - e2e-vm-mediation
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          E2E_INVENTORY_RESULT: ${{ needs.e2e-inventory.result }}
          E2E_IMAGE_CACHE_RESULT: ${{ needs.e2e-image-cache.result }}
          E2E_FAST_RESULT: ${{ needs.e2e-fast.result }}
          E2E_VM_RESULT: ${{ needs.e2e-vm.result }}
          E2E_VM_MEDIATION_RESULT: ${{ needs.e2e-vm-mediation.result }}
        run: |
          set -euo pipefail
          results=(
            "quality=${QUALITY_RESULT}"
            "tests=${TESTS_RESULT}"
            "e2e-inventory=${E2E_INVENTORY_RESULT}"
            "e2e-image-cache=${E2E_IMAGE_CACHE_RESULT}"
            "e2e-fast=${E2E_FAST_RESULT}"
            "e2e-vm=${E2E_VM_RESULT}"
            "e2e-vm-mediation=${E2E_VM_MEDIATION_RESULT}"
          )
          printf '%s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [[ "${result##*=}" != success ]]; then
              echo "CI lane did not pass: ${result}" >&2
              exit 1
            fi
          done
