name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: .cache/apt-packages
          key: ${{ runner.os }}-apt-v1-age-qemu-system-arm-qemu-system-x86-xz-utils

      - name: Install system packages
        env:
          APT_CACHE_DIR: .cache/apt-packages
        run: |
          set -euo pipefail
          mkdir -p "${APT_CACHE_DIR}"
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -f "${APT_CACHE_DIR}"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --download-only age qemu-system-arm qemu-system-x86 xz-utils
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} "${APT_CACHE_DIR}/" \;
          sudo chown -R "${USER}:${USER}" "${APT_CACHE_DIR}"
          sudo apt-get install -y age qemu-system-arm qemu-system-x86 xz-utils

      - name: Resolve Gondolin Zig version
        id: zig-version
        run: |
          set -euo pipefail
          ZON_PATH="$(find node_modules -path '*/@earendil-works/gondolin/dist/guest/build.zig.zon' -print -quit)"
          ZIG_VERSION="$(sed -n 's/.*\.minimum_zig_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${ZON_PATH}")"
          if [[ -z "${ZIG_VERSION}" ]]; then
            echo "Could not resolve Gondolin minimum Zig version from ${ZON_PATH}" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) ZIG_ARCH="x86_64" ;;
            aarch64|arm64) ZIG_ARCH="aarch64" ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "version=${ZIG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "arch=${ZIG_ARCH}" >> "${GITHUB_OUTPUT}"
          echo "Gondolin requires Zig ${ZIG_VERSION} (${ZIG_ARCH})"

      - name: Cache Zig tarballs
        uses: actions/cache@v4
        with:
          path: .cache/zig
          key: ${{ runner.os }}-zig-${{ steps.zig-version.outputs.arch }}-${{ steps.zig-version.outputs.version }}

      - name: Install Zig for Gondolin e2e tests
        env:
          ZIG_ARCH: ${{ steps.zig-version.outputs.arch }}
          ZIG_VERSION: ${{ steps.zig-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .cache/zig
          ZIG_ARCHIVE=".cache/zig/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          if [[ ! -s "${ZIG_ARCHIVE}" ]]; then
            for attempt in $(seq 1 30); do
              if curl \
                --fail \
                --location \
                --show-error \
                --continue-at - \
                --connect-timeout 15 \
                --speed-limit 1024 \
                --speed-time 60 \
                --max-time 300 \
                --output "${ZIG_ARCHIVE}" \
                "${ZIG_URL}"; then
                break
              fi
              echo "Zig download attempt ${attempt} failed; retrying with resume"
            done
          fi
          test -s "${ZIG_ARCHIVE}"
          xz --test "${ZIG_ARCHIVE}"
          if [[ ! -x "/opt/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}/zig" ]]; then
            sudo tar -xJf "${ZIG_ARCHIVE}" -C /opt
          fi
          sudo ln -sf "/opt/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Build
        run: pnpm build

      - name: Test taxonomy audit
        run: pnpm test:taxonomy

      - name: Lint
        run: pnpm lint

      - name: Type-aware lint
        run: pnpm lint:types

      - name: Format check
        run: pnpm fmt:check

      # Typecheck skipped in CI — @earendil-works/gondolin is locally linked
      # and not available in CI. Run `pnpm check` locally to verify types.

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E inventory
        run: pnpm test:e2e:inventory

      - name: Non-secret E2E proofs
        run: |
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD=1 pnpm test:e2e:vm
          AGENT_VM_E2E_SKIP_WORKSPACE_BUILD=1 pnpm test:e2e:vm-mediation
