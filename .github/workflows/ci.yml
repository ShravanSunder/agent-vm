name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age qemu-system-arm xz-utils

      - name: Install Zig for Gondolin smoke tests
        run: |
          set -euo pipefail
          ZON_PATH="$(find node_modules -path '*/@earendil-works/gondolin/dist/guest/build.zig.zon' -print -quit)"
          ZIG_VERSION="$(sed -n 's/.*\.minimum_zig_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${ZON_PATH}")"
          if [[ -z "${ZIG_VERSION}" ]]; then
            echo "Could not resolve Gondolin minimum Zig version from ${ZON_PATH}" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) ZIG_ARCH="x86_64" ;;
            aarch64|arm64) ZIG_ARCH="aarch64" ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          sudo tar -C /opt -xf /tmp/zig.tar.xz
          sudo ln -sf "/opt/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Typecheck skipped in CI — @earendil-works/gondolin is locally linked
      # and not available in CI. Run `pnpm check` locally to verify types.

      - name: Unit tests
        run: pnpm test

      - name: Gondolin rootfs smoke test
        run: pnpm vitest run --config vitest.smoke.config.ts packages/gondolin-adapter/src/build-pipeline.smoke.test.ts
