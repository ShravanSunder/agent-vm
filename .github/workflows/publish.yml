name: Publish

# Publishes managed GHCR base images. npm publishing is optional and
# disabled by default until npm Trusted Publishing is configured for
# each @agent-vm/* package. Use scripts/publish-local.sh from master
# for npm releases today.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      base_images_mode:
        description: 'How to handle managed GHCR base image tags'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - rebuild
          - retag
          - skip
      publish_npm:
        description: 'Publish npm packages after ensuring base image tags'
        required: true
        default: false
        type: boolean
      managed_image_tag:
        description: 'Optional managed GHCR image tag to create; defaults to packages/agent-vm/managed-images.json'
        required: false
        default: ''
        type: string
      source_managed_image_tag:
        description: 'Optional managed GHCR source tag for retag mode'
        required: false
        default: ''
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Upgrade npm to >= 11.5.1 (Trusted Publishing requirement)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: .cache/apt-packages
          key: ${{ runner.os }}-apt-v1-age-qemu-system-arm-qemu-system-x86-xz-utils

      - name: Install system packages
        env:
          APT_CACHE_DIR: .cache/apt-packages
        run: |
          set -euo pipefail
          mkdir -p "${APT_CACHE_DIR}"
          sudo mkdir -p /var/cache/apt/archives
          sudo cp -f "${APT_CACHE_DIR}"/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --download-only age qemu-system-arm qemu-system-x86 xz-utils
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -n {} "${APT_CACHE_DIR}/" \;
          sudo chown -R "${USER}:${USER}" "${APT_CACHE_DIR}"
          sudo apt-get install -y age qemu-system-arm qemu-system-x86 xz-utils

      - name: Resolve Gondolin Zig version
        id: zig-version
        run: |
          set -euo pipefail
          ZON_PATH="$(find node_modules -path '*/@earendil-works/gondolin/dist/guest/build.zig.zon' -print -quit)"
          ZIG_VERSION="$(sed -n 's/.*\.minimum_zig_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${ZON_PATH}")"
          if [[ -z "${ZIG_VERSION}" ]]; then
            echo "Could not resolve Gondolin minimum Zig version from ${ZON_PATH}" >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64) ZIG_ARCH="x86_64" ;;
            aarch64|arm64) ZIG_ARCH="aarch64" ;;
            *) echo "Unsupported CI architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "version=${ZIG_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "arch=${ZIG_ARCH}" >> "${GITHUB_OUTPUT}"
          echo "Gondolin requires Zig ${ZIG_VERSION} (${ZIG_ARCH})"

      - name: Cache Zig tarballs
        uses: actions/cache@v4
        with:
          path: .cache/zig
          key: ${{ runner.os }}-zig-${{ steps.zig-version.outputs.arch }}-${{ steps.zig-version.outputs.version }}

      - name: Install Zig for Gondolin e2e tests
        env:
          ZIG_ARCH: ${{ steps.zig-version.outputs.arch }}
          ZIG_VERSION: ${{ steps.zig-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .cache/zig
          ZIG_ARCHIVE=".cache/zig/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}.tar.xz"
          if [[ ! -s "${ZIG_ARCHIVE}" ]]; then
            for attempt in $(seq 1 30); do
              if curl \
                --fail \
                --location \
                --show-error \
                --continue-at - \
                --connect-timeout 15 \
                --speed-limit 1024 \
                --speed-time 60 \
                --max-time 300 \
                --output "${ZIG_ARCHIVE}" \
                "${ZIG_URL}"; then
                break
              fi
              echo "Zig download attempt ${attempt} failed; retrying with resume"
            done
          fi
          test -s "${ZIG_ARCHIVE}"
          xz --test "${ZIG_ARCHIVE}"
          if [[ ! -x "/opt/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}/zig" ]]; then
            sudo tar -xJf "${ZIG_ARCHIVE}" -C /opt
          fi
          sudo ln -sf "/opt/zig-${ZIG_ARCH}-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Build
        run: pnpm build

      - name: Test taxonomy audit
        run: pnpm test:taxonomy

      - name: Lint
        run: pnpm lint

      - name: Type-aware lint
        run: pnpm lint:types

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E inventory
        run: pnpm test:e2e:inventory

      - name: Non-secret E2E proofs
        run: AGENT_VM_E2E_SKIP_WORKSPACE_BUILD=1 pnpm test:e2e

      - name: Detect managed base image changes
        id: base_images
        env:
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.base_images_mode || 'auto' }}
          REQUESTED_MANAGED_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.managed_image_tag || '' }}
          REQUESTED_SOURCE_MANAGED_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.source_managed_image_tag || '' }}
          PUBLISH_NPM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./packages/agent-vm/package.json').version")"
          MANAGED_IMAGE_TAG="$(node -e "console.log(require('./packages/agent-vm/managed-images.json').baseImages['tool-vm'].tag)")"
          IMAGE_TAG="${REQUESTED_MANAGED_IMAGE_TAG:-${MANAGED_IMAGE_TAG}}"
          if [[ "${PUBLISH_NPM}" == "true" && "${IMAGE_TAG}" != "${MANAGED_IMAGE_TAG}" ]]; then
            echo "Cannot publish npm with managed_image_tag override; update packages/agent-vm/managed-images.json instead." >&2
            exit 1
          fi
          PREVIOUS_VERSION="$(git tag --sort=-v:refname --list 'v*.*.*' | sed 's/^v//' | grep -v "^${PACKAGE_VERSION}$" | head -n 1 || true)"
          SOURCE_IMAGE_TAG="${REQUESTED_SOURCE_MANAGED_IMAGE_TAG}"
          if [[ -z "${PREVIOUS_VERSION}" ]]; then
            AUTO_MODE="rebuild"
          elif git diff --quiet "v${PREVIOUS_VERSION}..HEAD" -- \
            docker/base-images \
            packages/agent-vm/managed-images.json \
            packages/agent-vm/src/build/managed-image-dockerfile.ts \
            packages/agent-vm/src/cli/vm-host-system-templates.ts \
            packages/agent-vm/src/cli/openclaw-plugin-bundle.ts; then
            AUTO_MODE="skip"
          else
            AUTO_MODE="rebuild"
          fi

          if [[ "${REQUESTED_MODE}" == "auto" ]]; then
            MODE="${AUTO_MODE}"
          else
            MODE="${REQUESTED_MODE}"
          fi
          if [[ "${MODE}" == "retag" && -z "${SOURCE_IMAGE_TAG}" ]]; then
            echo "Cannot retag managed base images because no source managed image tag was provided." >&2
            exit 1
          fi

          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "previous_version=${PREVIOUS_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "source_image_tag=${SOURCE_IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "mode=${MODE}" >> "${GITHUB_OUTPUT}"
          echo "Managed base image mode: ${MODE} (auto=${AUTO_MODE}, package=${PACKAGE_VERSION}, image=${IMAGE_TAG}, source=${SOURCE_IMAGE_TAG:-none})"

      - name: Set up QEMU
        if: steps.base_images.outputs.mode == 'rebuild'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.base_images.outputs.mode != 'skip' || github.event_name != 'workflow_dispatch' || inputs.publish_npm
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.base_images.outputs.mode != 'skip' || github.event_name != 'workflow_dispatch' || inputs.publish_npm
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Rebuild managed base images in GHCR
        if: steps.base_images.outputs.mode == 'rebuild'
        env:
          IMAGE_TAG: ${{ steps.base_images.outputs.image_tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "ghcr.io/shravansunder/agent-vm-managed-openclaw-gateway-base:${IMAGE_TAG}" \
            docker/base-images/openclaw-gateway
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "ghcr.io/shravansunder/agent-vm-managed-worker-gateway-base:${IMAGE_TAG}" \
            docker/base-images/worker-gateway
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "ghcr.io/shravansunder/agent-vm-managed-tool-vm-base:${IMAGE_TAG}" \
            docker/base-images/tool-vm

      - name: Retag managed base images in GHCR
        if: steps.base_images.outputs.mode == 'retag'
        env:
          IMAGE_TAG: ${{ steps.base_images.outputs.image_tag }}
          SOURCE_IMAGE_TAG: ${{ steps.base_images.outputs.source_image_tag }}
        run: |
          set -euo pipefail
          for IMAGE in \
            "ghcr.io/shravansunder/agent-vm-managed-openclaw-gateway-base" \
            "ghcr.io/shravansunder/agent-vm-managed-worker-gateway-base" \
            "ghcr.io/shravansunder/agent-vm-managed-tool-vm-base"
          do
            docker buildx imagetools create \
              -t "${IMAGE}:${IMAGE_TAG}" \
              "${IMAGE}:${SOURCE_IMAGE_TAG}"
          done

      - name: Verify managed base image tags
        if: steps.base_images.outputs.mode != 'skip' || github.event_name != 'workflow_dispatch' || inputs.publish_npm
        env:
          IMAGE_TAG: ${{ steps.base_images.outputs.image_tag }}
        run: |
          set -euo pipefail
          for IMAGE in \
            "ghcr.io/shravansunder/agent-vm-managed-openclaw-gateway-base:${IMAGE_TAG}" \
            "ghcr.io/shravansunder/agent-vm-managed-worker-gateway-base:${IMAGE_TAG}" \
            "ghcr.io/shravansunder/agent-vm-managed-tool-vm-base:${IMAGE_TAG}"
          do
            docker buildx imagetools inspect --raw "${IMAGE}" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const manifest = JSON.parse(raw);
                const platforms = new Set((manifest.manifests ?? []).map((entry) => `${entry.platform?.os}/${entry.platform?.architecture}`));
                for (const platform of ["linux/amd64", "linux/arm64"]) {
                  if (!platforms.has(platform)) {
                    throw new Error(`${process.argv[1]} is missing ${platform}`);
                  }
                }
              });
            ' "${IMAGE}"
          done

      - name: Publish to npm via OIDC
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
        run: pnpm -r publish --access=public --no-git-checks
