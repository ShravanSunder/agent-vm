name: Publish

# Publishes every workspace package to npm using Trusted Publishing
# (OIDC).  No NPM_TOKEN secret is stored — npm exchanges the
# GitHub-issued OIDC token for a short-lived publish credential.
#
# Configure trusted publishers per package on npmjs.com BEFORE the
# first OIDC publish:
#   Package settings ▸ Trusted Publisher ▸ GitHub Actions
#   organization: ShravanSunder
#   repository:   agent-vm
#   workflow:     publish.yml
#   environment:  npm-publish
#
# Repeat for each of the 7 @agent-vm/* packages.  Provenance is
# generated automatically.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Upgrade npm to >= 11.5.1 (Trusted Publishing requirement)
        run: npm install -g npm@latest

      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish managed base images to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./packages/agent-vm/package.json').version")"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "ghcr.io/shravansunder/agent-vm-openclaw-gateway-base:${PACKAGE_VERSION}" \
            docker/base-images/openclaw-gateway
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "ghcr.io/shravansunder/agent-vm-worker-gateway-base:${PACKAGE_VERSION}" \
            docker/base-images/worker-gateway
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "ghcr.io/shravansunder/agent-vm-tool-vm-base:${PACKAGE_VERSION}" \
            docker/base-images/tool-vm
          for IMAGE in \
            "ghcr.io/shravansunder/agent-vm-openclaw-gateway-base:${PACKAGE_VERSION}" \
            "ghcr.io/shravansunder/agent-vm-worker-gateway-base:${PACKAGE_VERSION}" \
            "ghcr.io/shravansunder/agent-vm-tool-vm-base:${PACKAGE_VERSION}"
          do
            docker buildx imagetools inspect --raw "${IMAGE}" | node -e '
              let raw = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { raw += chunk; });
              process.stdin.on("end", () => {
                const manifest = JSON.parse(raw);
                const platforms = new Set((manifest.manifests ?? []).map((entry) => `${entry.platform?.os}/${entry.platform?.architecture}`));
                for (const platform of ["linux/amd64", "linux/arm64"]) {
                  if (!platforms.has(platform)) {
                    throw new Error(`${process.argv[1]} is missing ${platform}`);
                  }
                }
              });
            ' "${IMAGE}"
          done

      - name: Publish to npm via OIDC
        run: pnpm -r publish --access=public --no-git-checks
